spring.application.name=BTWEB10
server.port=${SERVER_PORT:8080}

# --- Database (no default for password) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/btweb10?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT (no default for secret; secret must be Base64, decoded length >= 32 bytes) ---
security.jwt.secret-key=${JWT_SECRET}
# milliseconds (3600000 = 1h)
security.jwt.expiration-time=${JWT_EXPIRATION:3600000}

# --- CORS (frontend is same-origin; only needed for other origins) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}
